name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zxp:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - run: node scripts/sync-manifest-version.js "${GITHUB_REF_NAME#v}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check

      - name: Build ZXP
        env:
          ZXP_CERT: ${{ secrets.ZXP_CERT }}
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
        run: |
          curl -L https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd -o ZXPSignCmd
          chmod +x ZXPSignCmd

          mkdir FontClusterApplyPluginIllustrator
          cp -R CSXS dist host FontClusterApplyPluginIllustrator/

          printf '%s' "$ZXP_CERT" | base64 -D > zxp-cert.p12
          ./ZXPSignCmd -sign ./FontClusterApplyPluginIllustrator ./FontClusterApplyPluginIllustrator.zxp ./zxp-cert.p12 "$ZXP_CERT_PASSWORD"

      - uses: softprops/action-gh-release@v2
        with:
          files: FontClusterApplyPluginIllustrator.zxp
