name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zxp:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - run: node --check client/index.js

      - name: Build ZXP
        env:
          ZXP_CERT: ${{ secrets.ZXP_CERT }}
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
        run: |
          curl -L https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd -o ZXPSignCmd
          chmod +x ZXPSignCmd

          mkdir FontClusterIllustrator
          cp -R CSXS client host FontClusterIllustrator/

          printf '%s' "$ZXP_CERT" | base64 -D > zxp-cert.p12
          ./ZXPSignCmd -sign ./FontClusterIllustrator ./FontClusterApplyPluginIllustrator.zxp ./zxp-cert.p12 "$ZXP_CERT_PASSWORD"

      - uses: softprops/action-gh-release@v2
        with:
          files: FontClusterApplyPluginIllustrator.zxp
